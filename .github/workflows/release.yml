name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos-installer
          - os: windows-latest
            artifact: windows-installer
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm install

      - name: Build
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Flatten artifacts
        run: |
          find . -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.app.tar.gz" -o -name "*.sig" \) -exec cp {} . \;
          echo "=== 平铺后的产物 ==="
          ls -la

      - name: Generate latest.json
        run: |
          python3 << 'PYEOF'
          import json, os, glob

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          base_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['GITHUB_REF_NAME']}"
          platforms = {}

          # macOS 更新包（.app.tar.gz + .sig）
          for tar in sorted(glob.glob("*.app.tar.gz")):
              sigs = glob.glob(tar + ".sig")
              if not sigs:
                  continue
              sig = open(sigs[0]).read()
              arch = "aarch64" if "aarch64" in tar else "x86_64"
              platforms[f"darwin-{arch}"] = {
                  "signature": sig,
                  "url": f"{base_url}/{os.path.basename(tar)}",
              }

          # Windows 更新包（.exe + .sig）
          for exe in sorted(glob.glob("*.exe")):
              sigs = glob.glob(exe + ".sig")
              if not sigs:
                  continue
              sig = open(sigs[0]).read()
              platforms["windows-x86_64"] = {
                  "signature": sig,
                  "url": f"{base_url}/{os.path.basename(exe)}",
              }

          data = {
              "version": version,
              "notes": "发现新版本，可自动更新",
              "pub_date": "",
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("=== latest.json 已生成 ===")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PYEOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "workTrace ${{ github.ref_name }}"
          draft: false
          generate_release_notes: true
          files: |
            *.dmg
            *.exe
            *.app.tar.gz
            *.sig
            latest.json
